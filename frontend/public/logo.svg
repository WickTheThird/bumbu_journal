<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="hashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Hash symbol with rounded ends and slight rotation for dynamism -->
  <g filter="url(#glow)" transform="rotate(-8 32 32)">
    <!-- Horizontal bars -->
    <rect x="12" y="22" width="40" height="6" rx="3" fill="url(#hashGrad)"/>
    <rect x="12" y="36" width="40" height="6" rx="3" fill="url(#hashGrad)"/>
    
    <!-- Vertical bars (slightly angled) -->
    <rect x="20" y="10" width="6" height="44" rx="3" fill="url(#hashGrad)" transform="skewX(-5)"/>
    <rect x="36" y="10" width="6" height="44" rx="3" fill="url(#hashGrad)" transform="skewX(-5)"/>
  </g>
  
  <!-- Accent dot -->
  <circle cx="52" cy="12" r="4" fill="#a855f7" opacity="0.8"/>
</svg>
